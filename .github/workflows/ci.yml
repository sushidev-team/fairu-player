name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # `--legacy-peer-deps` was needed while Storybook 8 conflicted with its own
      # addons. The tree resolves cleanly now, and keeping the flag would hide the
      # next incompatible upgrade instead of failing on it.
      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test -- --run

      - name: Build library
        run: npm run build:lib

  # Its own job, not a step in the test matrix. Bundle size is a property of the
  # built artefact rather than of the Node version that built it, so checking it
  # once is enough — and size-limit 13 requires Node >= 22.18, which made it fail
  # outright in the 20.x cell.
  #
  # `npm ci` on 20.x still prints an EBADENGINE warning for it. That is a
  # warning, not an error: the package installs and everything else runs, so
  # development on Node 20 is unaffected. Worth revisiting if 20 stays in the
  # matrix long-term.
  size:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      # Blocking. Budgets sit just above the current sizes, so this catches a
      # regression rather than documenting one — see the `size-limit` block in
      # package.json.
      - name: Check bundle size
        run: npm run size

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The published package contains only `dist` and depends on clsx, hls.js
      # and tailwind-merge, so a runtime advisory is the one that reaches
      # consumers. This gate must never be allowed to fail silently.
      - name: Audit runtime dependencies (blocking)
        run: npm audit --omit=dev --audit-level=low

      # Dev/build-time advisories are developer- and CI-machine risk rather than
      # consumer risk. Still gated, but at `high` so a moderate ReDoS in a build
      # tool cannot block a release.
      - name: Audit all dependencies (high and above)
        run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking. Zero errors, and a warning budget that only ever ratchets
      # down — see the `lint` script in package.json and Phase 0 of ROADMAP.md.
      - name: Run ESLint
        run: npm run lint

  # Proves the published custom element actually works in Vue, Angular, Svelte
  # and plain HTML — in a real browser, against `dist`, not against src.
  #
  # Its dependencies live in `verification/package.json` rather than in the
  # library's devDependencies: Angular, Vue and Svelte together are a large tree
  # that has no business slowing down `npm ci` for everyone else.
  e2e:
    runs-on: ubuntu-latest

    # This job installs and executes a large third-party tree (Angular, Vue,
    # Svelte, a browser) purely to render pages. It has no reason to be able to
    # write to the repository, and no reason to keep a usable token on disk.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install library dependencies
        run: npm ci

      # The apps import the built artefact, so this has to run first.
      - name: Build library
        run: npm run build:lib

      # `ci`, not `install`: the lockfile is committed and is the source of
      # truth. `install` is free to resolve a newer version than the one that
      # was verified, which is how a lockfile silently stops meaning anything —
      # see docs/DEPENDENCIES.md.
      - name: Install verification dependencies
        working-directory: verification
        run: npm ci

      # All three engines. WebKit in particular only runs here — Playwright's
      # build does not launch on current macOS, so CI is where that half of the
      # matrix is actually verified.
      - name: Install browsers
        working-directory: verification
        run: npm run install:browsers

      - name: Run framework verification
        working-directory: verification
        run: npm test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: verification/test-results/
          retention-days: 7

  storybook:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
